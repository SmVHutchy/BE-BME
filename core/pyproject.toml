[project]
name = "frame-core"
version = "0.1.0"
description = "Umweltdienst, Metrikspeicher, Regeldetektor und Chronikpipeline fuer das Oekosystem im Bilderrahmen"
readme = "../README.md"

# Untergrenze 3.13, damit Entwicklungs- und Zielumgebung denselben Interpreter
# benutzen. Die fruehere Obergrenze <3.14 kam ausschliesslich von CrewAI 1.x
# (deklariert >=3.10,<3.14); seit Phase 3 laeuft der zweistufige Chronikpfad
# (TwoStepChronicle, chronicle/two_step.py) ueber zwei schlichte httpx-Aufrufe
# statt ueber CrewAI, also entfaellt der Grund fuer die Obergrenze mit ihr.
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",   # bringt den WebSocket-Unterbau mit
    "httpx>=0.28",               # Open-Meteo-Abruf und Chronikpfad, asynchron
    "pydantic>=2.10",            # Vertragsmodelle aus docs/contract.md
    "pyyaml>=6.0",               # config/params.yaml
]

# Entwicklungswerkzeuge als uv-Gruppe: `uv sync` installiert sie mit, ohne dass
# sie im Wheel landen.
[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frame_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
