    <title>Ökosystem im Bilderrahmen</title>

      canvas { display: block; width: 100%; height: 100%; }

         fällt erst am Ende von Monat 1. Inhalt folgt in Phase 2. -->

    <!-- Phase 0: Gerüst und Vertrag. Es gibt noch keinen Einstiegspunkt.
